[workspace]
resolver = "2"
members = ["crates/*"]
# The Tauri shell needs system libraries (webkit2gtk, GTK) that the pure-Rust
# core does not. It is built separately; see docs/DECISIONS.md (ADR-003).
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["ProtonTrainer contributors"]

[workspace.dependencies]
# Internal crates
pt-core = { path = "crates/pt-core" }
pt-steam = { path = "crates/pt-steam" }
pt-proton = { path = "crates/pt-proton" }
pt-trainers = { path = "crates/pt-trainers" }
pt-execution = { path = "crates/pt-execution" }
pt-diagnostics = { path = "crates/pt-diagnostics" }
pt-database = { path = "crates/pt-database" }

# External crates shared by more than one member.
# Add a dependency here only when a phase actually needs it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "protontrainer"
description = "ProtonTrainer desktop shell (Tauri)"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["ProtonTrainer contributors"]

[lib]
name = "protontrainer_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

# Business logic lives in the workspace crates; this shell only adapts it to
# Tauri commands. See docs/ARCHITECTURE.md.
pt-core = { path = "../crates/pt-core" }
pt-steam = { path = "../crates/pt-steam" }
pt-proton = { path = "../crates/pt-proton" }
pt-trainers = { path = "../crates/pt-trainers" }
pt-execution = { path = "../crates/pt-execution" }
pt-diagnostics = { path = "../crates/pt-diagnostics" }
pt-database = { path = "../crates/pt-database" }

[lints.rust]
unsafe_code = "forbid"
